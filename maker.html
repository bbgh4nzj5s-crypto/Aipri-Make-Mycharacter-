<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>♡ マイキャラメーカー ♡</title><style>*{box-sizing:border-box}html,body{height:100%;height:100dvh;overflow:hidden}body{margin:0;background:#f3f1f8;color:#302b39;font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;display:flex;flex-direction:column}header{flex:0 0 auto;background:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:13px}header b{font-size:14px}a{color:#7c59c2;text-decoration:none}main{flex:1;min-height:0;width:100%;max-width:650px;margin:auto;padding:0;overflow:hidden}.workspace{height:100%;min-height:0;display:flex;flex-direction:column}.top{height:53%;min-height:0;display:flex;flex-direction:column;background:#fff}.toolbar{flex:0 0 auto;display:flex;gap:5px;align-items:center;padding:6px 8px}.toolbar select{min-width:0;flex:1;max-width:34%;font-size:12px;border:1px solid #e5e0f1;border-radius:9px;padding:9px 3px;background:#fff}.toolbar button{font-size:12px;padding:9px 8px}.stage-wrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;overflow:hidden;padding:3px}.stage{position:relative;height:100%;max-height:100%;width:auto;aspect-ratio:3/4;max-width:100%;background:linear-gradient(145deg,#fff,#f9f4ff);border:1px dashed #d8cbea;border-radius:10px;overflow:hidden;touch-action:none}.stage img{position:absolute;max-width:none;user-select:none;touch-action:none;transform-origin:center;cursor:grab}.stage img.selected{outline:2px dashed #9d72df}.stage .hint{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#aaa;font-size:12px;pointer-events:none}#status{height:18px;flex:0 0 auto;text-align:center;font-size:11px;color:#7459aa;overflow:hidden}.bottom{height:47%;min-height:0;display:flex;flex-direction:column;background:#e9e7ec}.category-strip{flex:0 0 auto;display:flex;overflow-x:auto;overscroll-behavior-x:contain;gap:5px;padding:7px 8px;background:#fff;scrollbar-width:none}.category-strip::-webkit-scrollbar{display:none}.category-strip button{flex:0 0 auto;white-space:nowrap;background:#f4f1fa;color:#6d6085;border:1px solid #ece7f3}.category-strip button.active{background:#ffeff5;color:#cc4276;border:2px solid #f36a99}.catalog-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 9px}.catalog-toolbar button{font-size:12px}.catalog-note{margin-left:auto;color:#777;font-size:11px}.catalog-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;gap:6px;padding:6px 9px 18px}.catalog-item{aspect-ratio:1;background:#fff;border:2px solid transparent;border-radius:10px;padding:4px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}.catalog-item img{width:100%;height:75%;object-fit:contain}.catalog-item span{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.empty-catalog{grid-column:1/-1;text-align:center;padding:22px 10px;color:#777;font-size:13px}button,select,input{font:inherit}button{border:0;border-radius:10px;background:#7557c5;color:#fff;padding:9px 11px;cursor:pointer}.light{background:#eee8fa;color:#5b459b}.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button{font-size:12px}.label{font-size:13px;color:#746b7e;margin:9px 0 5px}input[type=range]{width:100%}.layer{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:7px 0}.layer img{width:35px;height:35px;object-fit:contain}.layer span{flex:1;font-size:12px}small{color:#80778a}dialog{width:min(94vw,420px);max-height:78dvh;overflow-y:auto;border:0;border-radius:18px;padding:18px;box-shadow:0 10px 60px #0004}dialog::backdrop{background:#0006}.dialog-head{display:flex;align-items:center;justify-content:space-between}@media(max-height:680px){.top{height:49%}.bottom{height:51%}.toolbar{padding:3px 6px}.category-strip{padding:4px 6px}}</style></head><body><header><a href="index.html">‹ ライブラリ</a><b>♡ マイキャラメーカー ♡</b><span></span></header><main><div class="workspace"><section class="top"><div class="toolbar"><select aria-label="保存するキャラクター" id="character"></select><button class="light" onclick="openControls()">⚙ 調整</button><button onclick="saveDesign()">♡ 保存</button><button class="light" onclick="downloadPng()">画像保存</button></div><div class="stage-wrap"><div class="stage" id="stage"><div class="hint" id="hint">下の＋から画像を追加してね<br/>画像を指で動かして配置できるよ</div></div></div><div aria-live="polite" id="status"></div></section><section class="bottom"><div class="category-strip" id="categories"></div><div class="catalog-toolbar"><button onclick="file.click()">＋ パーツ画像を登録</button><button class="light" onclick="addUrl()">URL追加</button><span class="catalog-note">タップして配置</span></div><div class="catalog-scroll" id="catalog"></div></section></div><input accept="image/*" hidden="" id="file" multiple="" type="file"/><dialog id="controls"><div class="dialog-head"><b>パーツ調整</b><button class="light" onclick="document.getElementById('controls').close()">閉じる</button></div><div class="label">選択中：<b id="selectedName">なし</b></div><div class="label">大きさ</div><input id="scale" max="300" min="10" type="range" value="100"/><div class="label">回転</div><input id="rotate" max="180" min="-180" type="range" value="0"/><div class="tools"><button class="light" onclick="moveLayer(1)">前へ</button><button class="light" onclick="moveLayer(-1)">後ろへ</button><button class="light" onclick="resetPos()">中央へ</button><button class="light" onclick="removeLayer()">削除</button></div><h3>配置中のパーツ</h3><div id="layers"></div><p><a href="https://aipri.jp/verse/parts/" rel="noopener" target="_blank">アイプリ公式パーツ一覧</a></p><small>公式パーツの自動取得は未対応。画像を保存して登録してね。</small></dialog></main><script>
const KEY='mycharacter_11';let data=JSON.parse(localStorage.getItem(KEY)||'{"characters":[],"links":[]}');let parts=[],selected=-1,drag=null;let library=[],activeCategory='すべて';const CATEGORIES=['すべて','顔','耳','左目','右目','ハイライト','眉','口','髪','衣装','アクセ','その他'];const stage=document.getElementById('stage'),file=document.getElementById('file');let charSelect=document.getElementById('character');function setup(){renderCatalog();charSelect.innerHTML='<option value="">保存先を選択</option>'+data.characters.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');if(data.characters.length)charSelect.value=data.characters[0].id;render()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function add(src,name){library.push({src,name,category:activeCategory==='すべて'?'その他':activeCategory});renderCatalog();placePart(library.length-1)}function placePart(i){const p=library[i];if(!p)return;parts.push({src:p.src,name:p.name,x:50,y:50,scale:100,rotate:0});selected=parts.length-1;render()}function renderCatalog(){document.getElementById('categories').innerHTML=CATEGORIES.map(c=>`<button class="${c===activeCategory?'active':''}" onclick="activeCategory='${c}';renderCatalog()">${c}</button>`).join('');document.getElementById('catalog').innerHTML=library.map((p,i)=>({...p,i})).filter(p=>activeCategory==='すべて'||p.category===activeCategory).map(p=>`<button class="catalog-item" onclick="placePart(${p.i})"><img src="${p.src}"><span>${escapeHtml(p.name)}</span></button>`).join('')||'<div class="empty-catalog">このカテゴリにはまだ画像がないよ。<br>「＋ パーツ画像を登録」で追加してね。</div>'}function openControls(){document.getElementById('controls').showModal()}file.onchange=async e=>{for(const f of e.target.files){const src=await new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});add(src,f.name)}file.value=''};function addUrl(){const u=prompt('画像のURLを入力（画像への直接リンク）');if(u&&/^https:\/\//.test(u))add(u,'URL画像')}function render(){stage.querySelectorAll('img').forEach(e=>e.remove());document.getElementById('hint').style.display=parts.length?'none':'grid';parts.forEach((p,i)=>{const img=document.createElement('img');img.src=p.src;img.draggable=false;img.className=i===selected?'selected':'';img.style.left=p.x+'%';img.style.top=p.y+'%';img.style.width='45%';img.style.transform=`translate(-50%,-50%) scale(${p.scale/100}) rotate(${p.rotate}deg)`;img.style.zIndex=i+1;img.addEventListener('pointerdown',e=>{e.preventDefault();selected=i;drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:p.x,py:p.y};img.setPointerCapture(e.pointerId);updateControls();renderLayers();stage.querySelectorAll('img').forEach((el,j)=>el.classList.toggle('selected',j===i))});img.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;p.x=Math.max(-50,Math.min(150,drag.px+(e.clientX-drag.x)/stage.clientWidth*100));p.y=Math.max(-50,Math.min(150,drag.py+(e.clientY-drag.y)/stage.clientHeight*100));img.style.left=p.x+'%';img.style.top=p.y+'%'});img.addEventListener('pointerup',()=>drag=null);img.addEventListener('pointercancel',()=>drag=null);stage.appendChild(img)});updateControls();renderLayers()}function renderLayers(){document.getElementById('layers').innerHTML=parts.map((p,i)=>`<div class="layer"><img src="${p.src}"><span>${escapeHtml(p.name)}</span><button class="${i===selected?'':'light'}" onclick="selected=${i};render()">選択</button></div>`).join('')||'<small>まだパーツがありません</small>'}function updateControls(){const p=parts[selected];document.getElementById('selectedName').textContent=p?p.name:'なし';document.getElementById('scale').value=p?p.scale:100;document.getElementById('rotate').value=p?p.rotate:0}document.getElementById('scale').oninput=e=>{if(parts[selected]){parts[selected].scale=+e.target.value;render()}};document.getElementById('rotate').oninput=e=>{if(parts[selected]){parts[selected].rotate=+e.target.value;render()}};function moveLayer(n){if(selected<0)return;let j=selected+n;if(j<0||j>=parts.length)return;[parts[j],parts[selected]]=[parts[selected],parts[j]];selected=j;render()}function removeLayer(){if(selected<0)return;parts.splice(selected,1);selected=Math.min(selected,parts.length-1);render()}function resetPos(){if(selected<0)return;parts[selected].x=50;parts[selected].y=50;render()}async function makePng(){const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1200;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,900,1200);for(const p of parts){const im=new Image();im.crossOrigin='anonymous';im.src=p.src;await im.decode();const w=405*p.scale/100,h=w*im.naturalHeight/im.naturalWidth;ctx.save();ctx.translate(p.x/100*900,p.y/100*1200);ctx.rotate(p.rotate*Math.PI/180);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}return canvas.toDataURL('image/png')}async function saveDesign(){const c=data.characters.find(x=>x.id===charSelect.value);if(!c){alert('先にライブラリでキャラクターを作ってね');return}if(!parts.length){alert('パーツを追加してね');return}try{const src=await makePng();c.designs.push({src,memo:'マイキャラメーカーで作成'});if(!c.cover)c.cover=src;localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('status').textContent='♡ '+c.name+' のデザイン案に保存したよ！'}catch(e){alert('保存できませんでした。外部画像の制限や保存容量が原因の可能性があります。画像をファイルから読み込んでみてね。')}}async function downloadPng(){try{const a=document.createElement('a');a.href=await makePng();a.download='mycharacter-design.png';a.click()}catch(e){alert('画像を出力できませんでした。画像ファイルから読み込んでみてね。')}}setup();</script></body></html>

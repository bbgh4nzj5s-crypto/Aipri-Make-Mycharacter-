document.addEventListener('DOMContentLoaded',()=>{const input=document.createElement('input');input.type='file';input.accept='image/*';input.id='officialFile';input.style.display='none';document.body.append(input);input.onchange=async()=>{const f=input.files[0];if(!f||!pendingOfficial)return;const src=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});const {cat,name,key}=pendingOfficial;officialImages[key]=src;await dbPut({id:'official:'+key,src,name,category:cat});parts=parts.filter(p=>p.category!==cat);parts.push({src,name,category:cat,x:50,y:50,scale:100,rotate:0});selected=parts.length-1;renderCatalog();render();document.getElementById('status').textContent=cat+'：'+name+' の画像を配置';input.value='';pendingOfficial=null}});async function setup(){try{library=(await dbAll()).filter(x=>!x.id.startsWith('official:'));for(const p of await dbAll()){if(p.id.startsWith('official:'))officialImages[p.id.slice(9)]=p.src}}catch(e){alert('画像保存領域を開けませんでした：'+e.message)}renderCatalog();document.getElementById('avatar').innerHTML='';charSelect.innerHTML='<option value="">保存先を選択</option>'+data.characters.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');if(data.characters.length)charSelect.value=data.characters[0].id;render()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function add(src,name,cat=activeCategory){const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),src,name,category:cat};await dbPut(item);library.push(item);renderCatalog();document.getElementById('status').textContent='保存しました：'+name}function placePart(i){const p=library[i];if(!p)return;parts.push({src:p.src,name:p.name,x:50,y:50,scale:100,rotate:0});selected=parts.length-1;render()}function renderCatalog(){document.getElementById('categories').innerHTML=CATEGORIES.map(c=>`<button class="${c===activeCategory?'active':''}" onclick="activeCategory='${c}';renderCatalog()">${c}</button>`).join('');const official=(OFFICIAL[activeCategory]||[]).map((name,i)=>{const src=officialImages[activeCategory+'::'+name];return `<button class="catalog-item ${chosen[activeCategory]===name?'chosen':''}" onclick="chooseOfficial('${activeCategory}',${i})">${src?`<img src="${src}" alt="">`:'<span class="mini-preview">＋画像</span>'}<span>${escapeHtml(name)}</span></button>`}).join('');const custom=library.map((p,i)=>({...p,i})).filter(p=>p.category===activeCategory).map(p=>`<button class="catalog-item" onclick="placePart(${p.i})"><img src="${p.src}"><span>${escapeHtml(p.name)}</span></button>`).join('');document.getElementById('catalog').innerHTML=official+custom||'<div class="empty-catalog">画像を追加してね</div>';document.getElementById('catalog').scrollTop=0}function previewIcon(c){return {'フェイス':'☺','はだ':'●','まえがみ':'〰','うしろがみ':'♧','ヘアカラー':'♥','アイカラー':'◉','メッシュタイプ':'≋','ヘアデコ':'✿','メイク':'✦','ワンポイント':'♡','おねがいジュエル':'✧','ボイス':'♫'}[c]||'✿'}function previewColor(c,i){if(c==='ヘアカラー')return hairColors[i%hairColors.length];if(c==='アイカラー')return eyeColors[i%eyeColors.length];if(c==='はだ')return skinColors[i%skinColors.length];return ['#fff0f5','#f1e9ff','#f5f0ff','#eaf8f8','#fff3df'][i%5]}function chooseOfficial(cat,i){const name=OFFICIAL[cat][i],key=cat+'::'+name;chosen[cat]=name;if(officialImages[key]){parts=parts.filter(p=>p.category!==cat);parts.push({src:officialImages[key],name,category:cat,x:50,y:50,scale:100,rotate:0});selected=parts.length-1;render();renderCatalog();document.getElementById('status').textContent=cat+'：'+name;return}pendingOfficial={cat,name,key};document.getElementById('officialFile').click()}
function openControls(){document.getElementById('controls').showModal()}file.onchange=async e=>{for(const f of e.target.files){const src=await new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});await add(src,f.name,activeCategory)}file.value=''};function addUrl(){const u=prompt('画像のURLを入力（画像への直接リンク）');if(u&&/^https:\/\//.test(u))add(u,'URL画像')}function render(){stage.querySelectorAll('img').forEach(e=>e.remove());document.getElementById('hint').style.display=(parts.length||Object.values(chosen).some(Boolean))?'none':'grid';parts.forEach((p,i)=>{const img=document.createElement('img');img.src=p.src;img.draggable=false;img.className=i===selected?'selected':'';img.style.left=p.x+'%';img.style.top=p.y+'%';img.style.width='45%';img.style.transform=`translate(-50%,-50%) scale(${p.scale/100}) rotate(${p.rotate}deg)`;img.style.zIndex=i+1;img.addEventListener('pointerdown',e=>{e.preventDefault();selected=i;drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:p.x,py:p.y};img.setPointerCapture(e.pointerId);updateControls();renderLayers();stage.querySelectorAll('img').forEach((el,j)=>el.classList.toggle('selected',j===i))});img.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;p.x=Math.max(-50,Math.min(150,drag.px+(e.clientX-drag.x)/stage.clientWidth*100));p.y=Math.max(-50,Math.min(150,drag.py+(e.clientY-drag.y)/stage.clientHeight*100));img.style.left=p.x+'%';img.style.top=p.y+'%'});img.addEventListener('pointerup',()=>drag=null);img.addEventListener('pointercancel',()=>drag=null);stage.appendChild(img)});updateControls();renderLayers()}function renderLayers(){document.getElementById('layers').innerHTML=parts.map((p,i)=>`<div class="layer"><img src="${p.src}"><span>${escapeHtml(p.name)}</span><button class="${i===selected?'':'light'}" onclick="selected=${i};render()">選択</button></div>`).join('')||'<small>まだパーツがありません</small>'}function updateControls(){const p=parts[selected];document.getElementById('selectedName').textContent=p?p.name:'なし';document.getElementById('scale').value=p?p.scale:100;document.getElementById('rotate').value=p?p.rotate:0}document.getElementById('scale').oninput=e=>{if(parts[selected]){parts[selected].scale=+e.target.value;render()}};document.getElementById('rotate').oninput=e=>{if(parts[selected]){parts[selected].rotate=+e.target.value;render()}};function moveLayer(n){if(selected<0)return;let j=selected+n;if(j<0||j>=parts.length)return;[parts[j],parts[selected]]=[parts[selected],parts[j]];selected=j;render()}function removeLayer(){if(selected<0)return;parts.splice(selected,1);selected=Math.min(selected,parts.length-1);render()}function resetPos(){if(selected<0)return;parts[selected].x=50;parts[selected].y=50;render()}async function makePng(){const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1200;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,900,1200);if(false){const svg=document.querySelector('#avatar svg');const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);try{const av=new Image();av.src=url;await av.decode();ctx.drawImage(av,0,0,900,1200)}finally{URL.revokeObjectURL(url)}}for(const p of parts){const im=new Image();im.crossOrigin='anonymous';im.src=p.src;await im.decode();const w=405*p.scale/100,h=w*im.naturalHeight/im.naturalWidth;ctx.save();ctx.translate(p.x/100*900,p.y/100*1200);ctx.rotate(p.rotate*Math.PI/180);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}return canvas.toDataURL('image/png')}async function saveDesign(){const c=data.characters.find(x=>x.id===charSelect.value);if(!c){alert('先にライブラリでキャラクターを作ってね');return}if(!parts.length&&!Object.values(chosen).some(Boolean)){alert('パーツを選んでね');return}try{const src=await makePng();c.designs.push({src,memo:'マイキャラメーカーで作成'});if(!c.cover)c.cover=src;localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('status').textContent='♡ '+c.name+' のデザイン案に保存したよ！'}catch(e){alert('保存できませんでした。外部画像の制限や保存容量が原因の可能性があります。画像をファイルから読み込んでみてね。')}}async function downloadPng(){try{const a=document.createElement('a');a.href=await makePng();a.download='mycharacter-design.png';a.click()}catch(e){alert('画像を出力できませんでした。画像ファイルから読み込んでみてね。')}}const DB_NAME='mycharacter_parts_v16';
function dbOpen(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore('images',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function dbAll(){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('images','readonly');const req=tx.objectStore('images').getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function dbPut(item){const db=await dbOpen();return new Promise((resolve,reject)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(item);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}

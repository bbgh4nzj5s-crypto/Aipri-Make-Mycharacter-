<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>♡ マイキャラメーカー ♡</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f1f8;color:#302b39;font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}header{background:white;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}a{color:#7c59c2;text-decoration:none}main{max-width:600px;margin:auto;padding:14px 14px 90px}.card{background:white;border-radius:18px;padding:14px;margin:12px 0}button,select,input{font:inherit}button{border:0;border-radius:12px;background:#7557c5;color:white;padding:10px 13px}button.light{background:#eee8fa;color:#5b459b}.tools{display:flex;gap:7px;flex-wrap:wrap}.tools button{font-size:13px}.stage{position:relative;width:min(100%,370px);aspect-ratio:3/4;background:linear-gradient(145deg,#fff,#f9f4ff);border:2px dashed #d8cbea;border-radius:16px;margin:12px auto;overflow:hidden;touch-action:none}.stage img{position:absolute;max-width:none;user-select:none;touch-action:none;transform-origin:center;cursor:grab}.stage img.selected{outline:2px dashed #9d72df}.stage .hint{position:absolute;inset:0;display:grid;place-items:center;color:#aaa;text-align:center;pointer-events:none}.list{display:flex;gap:7px;overflow:auto;padding:8px 0}.list button{white-space:nowrap}.layer{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:8px 0}.layer img{width:38px;height:38px;object-fit:contain}.layer span{flex:1;font-size:13px}.label{font-size:13px;color:#746b7e;margin:8px 0}input[type=file]{max-width:100%}input[type=range]{width:100%}small{color:#80778a}#status{color:#7b5da8;font-size:13px}</style></head><body><header><a href="index.html">‹ ライブラリ</a><b>♡ マイキャラメーカー ♡</b><span></span></header><main><div class="card"><div class="label">保存するキャラクター</div><select id="character" style="width:100%;padding:10px;border-radius:10px"></select><div class="stage" id="stage"><div class="hint" id="hint">＋ パーツを追加して<br>ここに重ねてね</div></div><div class="tools"><button onclick="file.click()">＋ 画像パーツを選ぶ</button><button class="light" onclick="addUrl()">画像URLから追加</button><button class="light" onclick="resetPos()">中央に戻す</button></div><input id="file" type="file" accept="image/*" multiple hidden><p><small>パーツを指で動かして配置。画像を選ぶと大きさ・回転・重なり順を変更できるよ。</small></p><div class="label">選択中のパーツ：<b id="selectedName">なし</b></div><div class="label">大きさ</div><input id="scale" type="range" min="10" max="300" value="100"><div class="label">回転</div><input id="rotate" type="range" min="-180" max="180" value="0"><div class="tools"><button class="light" onclick="moveLayer(1)">前へ</button><button class="light" onclick="moveLayer(-1)">後ろへ</button><button class="light" onclick="removeLayer()">削除</button></div><h3>重ねたパーツ</h3><div id="layers"></div><div class="tools"><button onclick="saveDesign()">♡ デザイン案に保存</button><button class="light" onclick="downloadPng()">PNG保存</button></div><p id="status"></p></div><div class="card"><b>アイプリ公式パーツ</b><p><small>公式一覧から画像を保存して、上の「画像パーツを選ぶ」で読み込めるよ。公式一覧の画像をアプリ内に自動収録する機能はまだ未実装。</small></p><a href="https://aipri.jp/verse/parts/" target="_blank">公式マイキャラパーツ一覧を見る ↗</a></div></main><script>
const KEY='mycharacter_11';let data=JSON.parse(localStorage.getItem(KEY)||'{"characters":[],"links":[]}');let parts=[],selected=-1,drag=null;const stage=document.getElementById('stage'),file=document.getElementById('file');let charSelect=document.getElementById('character');function setup(){charSelect.innerHTML='<option value="">保存先を選択</option>'+data.characters.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');if(data.characters.length)charSelect.value=data.characters[0].id;render()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function add(src,name){parts.push({src,name,x:50,y:50,scale:100,rotate:0});selected=parts.length-1;render()}file.onchange=async e=>{for(const f of e.target.files){const src=await new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});add(src,f.name)}file.value=''};function addUrl(){const u=prompt('画像のURLを入力（画像への直接リンク）');if(u&&/^https:\/\//.test(u))add(u,'URL画像')}function render(){stage.querySelectorAll('img').forEach(e=>e.remove());document.getElementById('hint').style.display=parts.length?'none':'grid';parts.forEach((p,i)=>{const img=document.createElement('img');img.src=p.src;img.draggable=false;img.className=i===selected?'selected':'';img.style.left=p.x+'%';img.style.top=p.y+'%';img.style.width='45%';img.style.transform=`translate(-50%,-50%) scale(${p.scale/100}) rotate(${p.rotate}deg)`;img.style.zIndex=i+1;img.addEventListener('pointerdown',e=>{e.preventDefault();selected=i;drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:p.x,py:p.y};img.setPointerCapture(e.pointerId);updateControls();renderLayers();stage.querySelectorAll('img').forEach((el,j)=>el.classList.toggle('selected',j===i))});img.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;p.x=Math.max(-50,Math.min(150,drag.px+(e.clientX-drag.x)/stage.clientWidth*100));p.y=Math.max(-50,Math.min(150,drag.py+(e.clientY-drag.y)/stage.clientHeight*100));img.style.left=p.x+'%';img.style.top=p.y+'%'});img.addEventListener('pointerup',()=>drag=null);img.addEventListener('pointercancel',()=>drag=null);stage.appendChild(img)});updateControls();renderLayers()}function renderLayers(){document.getElementById('layers').innerHTML=parts.map((p,i)=>`<div class="layer"><img src="${p.src}"><span>${escapeHtml(p.name)}</span><button class="${i===selected?'':'light'}" onclick="selected=${i};render()">選択</button></div>`).join('')||'<small>まだパーツがありません</small>'}function updateControls(){const p=parts[selected];document.getElementById('selectedName').textContent=p?p.name:'なし';document.getElementById('scale').value=p?p.scale:100;document.getElementById('rotate').value=p?p.rotate:0}document.getElementById('scale').oninput=e=>{if(parts[selected]){parts[selected].scale=+e.target.value;render()}};document.getElementById('rotate').oninput=e=>{if(parts[selected]){parts[selected].rotate=+e.target.value;render()}};function moveLayer(n){if(selected<0)return;let j=selected+n;if(j<0||j>=parts.length)return;[parts[j],parts[selected]]=[parts[selected],parts[j]];selected=j;render()}function removeLayer(){if(selected<0)return;parts.splice(selected,1);selected=Math.min(selected,parts.length-1);render()}function resetPos(){if(selected<0)return;parts[selected].x=50;parts[selected].y=50;render()}async function makePng(){const canvas=document.createElement('canvas');canvas.width=900;canvas.height=1200;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,900,1200);for(const p of parts){const im=new Image();im.crossOrigin='anonymous';im.src=p.src;await im.decode();const w=405*p.scale/100,h=w*im.naturalHeight/im.naturalWidth;ctx.save();ctx.translate(p.x/100*900,p.y/100*1200);ctx.rotate(p.rotate*Math.PI/180);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()}return canvas.toDataURL('image/png')}async function saveDesign(){const c=data.characters.find(x=>x.id===charSelect.value);if(!c){alert('先にライブラリでキャラクターを作ってね');return}if(!parts.length){alert('パーツを追加してね');return}try{const src=await makePng();c.designs.push({src,memo:'マイキャラメーカーで作成'});if(!c.cover)c.cover=src;localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('status').textContent='♡ '+c.name+' のデザイン案に保存したよ！'}catch(e){alert('保存できませんでした。外部画像の制限や保存容量が原因の可能性があります。画像をファイルから読み込んでみてね。')}}async function downloadPng(){try{const a=document.createElement('a');a.href=await makePng();a.download='mycharacter-design.png';a.click()}catch(e){alert('画像を出力できませんでした。画像ファイルから読み込んでみてね。')}}setup();</script></body></html>

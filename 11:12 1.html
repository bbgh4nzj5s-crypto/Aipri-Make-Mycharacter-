<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff5fa"><title>Pricoletta ♡ 新登録フロー試作</title><style>
:root{--pink:#df6aa9;--deep:#b64c8b;--soft:#fce8f3;--line:#eecbdd;--ink:#79546c;--sub:#ab879f}*{box-sizing:border-box}body{margin:0;background:#fff6fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.45;cursor:default}.app{width:min(100%,470px);min-height:100dvh;margin:auto;padding-bottom:calc(100px + env(safe-area-inset-bottom));background:linear-gradient(#fffafd,#fff3fa)}header{height:59px;display:flex;align-items:center;justify-content:space-between;padding:0 19px;background:rgba(255,255,255,.9);border-bottom:2px solid #f5d5e5;color:#d5639f;font-weight:800}.tiny{font-size:11px;letter-spacing:1px;color:#bb84a5}h1{font-size:23px;margin:5px 0;color:#aa4e81}h2{font-size:18px;margin:0 0 10px;color:#a65387}p{line-height:1.55}.content{padding:19px 16px 24px}.progress{display:flex;gap:5px;margin:14px 0 22px}.progress i{height:5px;background:#efd5e3;border-radius:99px;flex:1}.progress i.active{background:#dc74aa}.pill{padding:5px 10px;border:1px solid var(--line);border-radius:100px;background:white;font-size:12px;color:#af7298}.card{padding:17px;border:1px solid #efd1e2;background:white;border-radius:21px;box-shadow:0 4px 18px #c984a50c;margin-bottom:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:9px}.hint{font-size:12px;color:var(--sub);line-height:1.5}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{border:1px solid #e8c1d7;border-radius:13px;width:100%;padding:13px 14px;outline:none;background:#fffafc;color:#67485b;font-size:16px}.field input:focus{border-color:#d96ea4;box-shadow:0 0 0 3px #ffe3f1}.seg{display:flex;gap:6px;padding:4px;background:#fbeaf3;border-radius:15px}.seg button{flex:1;padding:11px 4px;border:0;background:transparent;border-radius:12px;color:#9e718c;font-size:13px}.seg button.sel{background:white;color:#ac4d84;box-shadow:0 1px 6px #bd88a344;font-weight:750}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;background:white;color:#aa618d;border:1px solid #e7b8d1;padding:12px 13px;min-height:44px;font-weight:700;font-size:13px}.btn.primary{background:linear-gradient(#f28abc,#d967a3);color:white;border:2px solid #fff;box-shadow:0 4px 0 #b64e89,0 0 0 1px #d571a5}.btn.ghost{border:0;background:transparent;box-shadow:none}.btn.full{width:100%}.btn.small{padding:7px 9px;min-height:34px;font-size:12px}.actions{display:flex;gap:9px}.actions .btn{flex:1}.steps-foot{position:sticky;bottom:0;padding:13px 16px calc(12px + env(safe-area-inset-bottom));background:#fff9fdeb;border-top:1px solid #efd2e2;backdrop-filter:blur(14px)}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.choice{border:1.5px solid var(--line);background:white;border-radius:18px;min-height:138px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px;padding:12px;text-align:center}.choice.sel{background:#fff0f8;border-color:#df76af;box-shadow:inset 0 0 0 1px #e5a0c7}.choice .emoji{font-size:33px;color:#c16998}.choice b{font-size:14px}.choice small{font-size:11px;color:#ac839a}.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot{background:#fff;border:1.5px solid #eac9db;border-radius:17px;padding:10px;min-width:0}.slot.selected{border:2px solid #da75a9;background:#fff0f7}.slot .label{font-size:12px;color:#a65f8a;font-weight:750;margin-bottom:7px;display:flex;justify-content:space-between}.slot .picture{border-radius:11px;background:#fcf5f9;height:119px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#c4a0b6;font-size:12px}.slot .picture img{width:100%;height:100%;object-fit:contain}.empty{font-size:26px;color:#d4bbca}.tagrow{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:11px;padding:6px 9px;border-radius:100px;background:#fbeaf3;color:#a5638b}.match{border:1px solid #edcfdf;border-radius:13px;padding:12px;display:flex;align-items:center;gap:12px}.match .thumb{width:46px;height:56px;background:#fbe6f2;border-radius:8px;display:grid;place-items:center;color:#be82a4}.match strong{font-size:14px}.match label{font-size:13px;flex:1}.checkline{display:flex;align-items:center;gap:10px;padding:10px 0}.checkline input{accent-color:#d86ca5;width:18px;height:18px}.overview{display:grid;grid-template-columns:112px 1fr;gap:14px}.fullphoto{height:165px;border-radius:14px;border:1.5px dashed #e4aec9;background:#fff8fc;overflow:hidden;display:grid;place-items:center;text-align:center;color:#b27d9e;font-size:12px;padding:9px}.fullphoto img{width:100%;height:100%;object-fit:contain}.stat{font-size:12px;line-height:1.9;color:#9f7490}.stat b{color:#aa5389}.divider{height:1px;background:#f0d8e5;margin:15px 0}.notice{background:#fff1f8;border:1px solid #f0cddd;border-radius:12px;padding:11px;font-size:12px;color:#a5638b;margin-top:12px}.complete{text-align:center;padding:22px 10px}.complete .big{font-size:48px}.thumbstrip{display:flex;gap:7px;overflow:auto;padding-top:4px}.mini{width:53px;height:53px;border:1px solid #edd0df;background:#fff5fa;border-radius:10px;flex-shrink:0;overflow:hidden;display:grid;place-items:center}.mini img{width:100%;height:100%;object-fit:contain}.qrslots{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.qrslot{border:1px solid #ebc6d9;background:white;border-radius:14px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#a16590}.qrslot b{font-size:12px}.qrslot .qrthumb{height:33px;width:38px;display:grid;place-items:center}.qrthumb img{max-width:100%;max-height:100%;object-fit:contain}.qrslot span{font-size:11px}.muted{color:#aa859b}.hidden{display:none!important}
</style></head><body><div class="app"><header><span>♡ Pricoletta</span><span style="font-size:12px;color:#a77393">登録フロー試作</span></header><div class="content"><div class="tiny">PRICOLETTA · NEW REGISTRATION</div><div class="sectionhead"><h1 id="title">コーデ情報</h1><span class="pill" id="stepLabel">STEP 1 / 5</span></div><div id="bar" class="progress"></div><main id="main"></main></div><div id="footer" class="steps-foot"></div></div><input id="photoInput" type="file" accept="image/*" multiple hidden><input id="qrInput" type="file" accept="image/*" hidden><input id="fullInput" type="file" accept="image/*" hidden><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const state={step:0,name:'',number:'',kind:'separate',match:'new',method:'qr',images:{},qrs:{},full:null,fullName:'',chosen:-1,uploadFor:null,feedback:'',confirmed:false};const categories=()=>state.kind==='separate'?['アクセ','トップス','ボトムス','シューズ']:['アクセ','ワンピ','シューズ'];const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const img=obj=>obj?`<img src="${obj.url}" alt="${esc(obj.name)}">`:'<span class="empty">＋</span>';const icons=['◇','♧','▤','♢'];const titles=['コーデ情報','一致コーデの確認','登録方法を選択','画像を登録','コーデ詳細・確認'];function button(text,action,style=''){return `<button type="button" class="btn ${style}" data-action="${action}">${text}</button>`}function feedback(){return state.feedback?`<div class="notice">${esc(state.feedback)}</div>`:''}
function render(){const s=state.step;$('title').textContent=titles[s];$('stepLabel').textContent=`STEP ${s+1} / 5`;$('bar').innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<=s?'active':''}"></i>`).join('');$('main').innerHTML=([step0,step1,step2,step3,step4][s])();$('footer').innerHTML=s===0?button('次へ →','next','primary full'):s===1?`<div class="actions">${button('← 戻る','back')}${button('登録方法へ →','next','primary')}</div>`:s===2?`<div class="actions">${button('← 戻る','back')}${button('次へ →','next','primary')}</div>`:s===3?`<div class="actions">${button('← 戻る','back')}${button('コーデ詳細へ →','detail','primary')}</div>`:state.confirmed?button('最初からもう一度試す','restart','full'):button('登録内容を確認・完了（試作）','finish','primary full')}
function step0(){return `<section class="card"><h2>♡ コーデ情報を入力</h2><div class="field"><label for="name">コーデ名</label><input id="name" placeholder="例：トランプレディ" value="${esc(state.name)}"></div><div class="field"><label for="number">アイテム番号（任意）</label><input id="number" placeholder="例：OA4-028" value="${esc(state.number)}"></div><div class="field"><label>コーデタイプ</label><div class="seg"><button class="${state.kind==='separate'?'sel':''}" data-action="kind" data-value="separate">上下コーデ</button><button class="${state.kind==='dress'?'sel':''}" data-action="kind" data-value="dress">ワンピース</button></div></div></section><p class="hint">画像もQRも登録せずに進められるよ。あとから詳細画面で追加できる設計。</p>${feedback()}`}
function step1(){return `<section class="card"><h2>♡ 一致するコーデを確認</h2><p class="hint">「${esc(state.name||'コーデ名未入力')}」に近いコーデが登録されている場合、ここに候補が表示される想定だよ。</p><div class="match"><div class="thumb">♡</div><div style="flex:1"><strong>${esc(state.name||'サンプルコーデ')}</strong><div class="hint">既存コーデの候補（試作サンプル）</div></div></div><div class="divider"></div>${[['new','新しいコーデとして登録'],['existing','既存のコーデに追加（試作）'],['color','色違いのコーデとして登録（試作）']].map(([id,label])=>`<label class="checkline"><input type="radio" name="match" value="${id}" ${state.match===id?'checked':''}><span style="font-size:13px">${label}</span></label>`).join('')}</section><p class="hint">実際のコーデ検索やデータ統合は、この独立試作では行わないよ。</p>`}
function step2(){return `<section class="card"><h2>♡ どちらから登録する？</h2><p class="hint">もう一方も後で追加できるよ。</p><div class="choicegrid"><button class="choice ${state.method==='qr'?'sel':''}" data-action="method" data-value="qr"><span class="emoji">▦</span><b>QR画像</b><small>カテゴリ別に保存</small></button><button class="choice ${state.method==='image'?'sel':''}" data-action="method" data-value="image"><span class="emoji">▧</span><b>アイテム画像</b><small>最大${categories().length}枚まとめて</small></button></div><div style="margin-top:12px">${button('画像を登録せずに詳細へ','skip','ghost full')}</div></section>`}
function step3(){const cats=categories();const imageMode=state.method==='image';return `<section class="card"><div class="sectionhead"><h2>♡ ${imageMode?'アイテム画像の配置':'QR画像の登録'}</h2><span class="pill">${Object.keys(imageMode?state.images:state.qrs).length} 件</span></div>${imageMode?`<p class="hint">写真を選んだ順に ${cats.join(' → ')} へ仮配置。タップで画像を選び、別の枠をタップすると入れ替えできるよ。</p>${button('＋ 写真をまとめて選択','photos','full')}<div class="slots" style="margin-top:14px">${cats.map((cat,i)=>{const ob=state.images[i];return `<button type="button" class="slot ${state.chosen===i?'selected':''}" data-action="slot" data-index="${i}"><div class="label"><span>${cat}</span><span>${ob?'✓':''}</span></div><div class="picture">${img(ob)}</div></button>`}).join('')}</div><div style="margin-top:12px">${button('選択中の画像を外す','remove-image','small')}</div>`:`<p class="hint">カテゴリを押して写真を選択してね。QR画像の登録も任意だよ。</p><div class="qrslots">${cats.map((cat,i)=>`<button class="qrslot" data-action="qr" data-index="${i}"><div class="qrthumb">${state.qrs[i]?img(state.qrs[i]):'▦'}</div><b>${cat}</b><span>${state.qrs[i]?'登録済み・変更可':'＋ QRを追加'}</span></button>`).join('')}</div>`}</section><section class="card"><div class="sectionhead"><b style="font-size:14px">${imageMode?'アイテム画像':'QR画像'}の登録が終わったら</b><span class="pill">任意</span></div><p class="hint">もう一方の画像も追加できるよ。登録せずコーデ詳細へ進んでも大丈夫。</p>${button(imageMode?'＋ QR画像も追加する':'＋ アイテム画像も追加する','other','full')}</section>${feedback()}`}
function step4(){const cs=categories(),imCount=Object.keys(state.images).length,qrCount=Object.keys(state.qrs).length;return state.confirmed?`<div class="card complete"><div class="big">♡</div><h2>試作の登録フロー完了</h2><p class="hint">画面の動作確認だけ完了したよ。実際のプリコレッタには保存していないよ。</p></div>`:`<section class="card"><div class="sectionhead"><h2>♡ コーデ詳細</h2><span class="pill">最終確認</span></div><div class="overview"><button class="fullphoto" data-action="full">${state.full?img(state.full):'<span><span style="font-size:30px">＋</span><br>フルコーデ画像<br>を追加</span>'}</button><div><b style="color:#aa598a">${esc(state.name||'コーデ名未入力')}</b><div class="stat">アイテム番号：${esc(state.number||'未入力')}<br>タイプ：${state.kind==='separate'?'上下コーデ':'ワンピース'}<br>QR：<b>${qrCount} / ${cs.length}</b><br>アイテム画像：<b>${imCount} / ${cs.length}</b><br>フルコーデ画像：<b>${state.full?'登録済み':'未登録'}</b></div><div style="margin-top:8px">${button(state.full?'全身画像を変更':'＋ 全身画像を追加','full','small')}</div></div></div><div class="hint" style="margin-top:10px">フルコーデ画像は任意。ここで追加しても、追加せずに完了してもOK。</div><div class="divider"></div><div class="sectionhead"><b style="font-size:14px">QR画像</b><span class="hint">${qrCount} 件</span></div><div class="tagrow">${cs.map((c,i)=>`<span class="tag">${c} ${state.qrs[i]?'✓':'—'}</span>`).join('')}</div><div class="divider"></div><div class="sectionhead"><b style="font-size:14px">アイテム画像</b><span class="hint">${imCount} 枚</span></div><div class="thumbstrip">${cs.map((cat,i)=>`<div><div class="mini">${img(state.images[i])}</div><span class="hint" style="font-size:10px">${cat}</span></div>`).join('')}</div><div class="actions" style="margin-top:12px">${button('QRを追加・変更','editqr','small')}${button('画像を追加・変更','editimage','small')}</div></section><section class="card"><h2 style="font-size:15px">サムネイルについて</h2><p class="hint">フルコーデ画像を登録した場合、一覧のサムネイル候補として利用する想定。詳細の画像表示調整は、本番の既存機能につなぐよ。</p></section>${feedback()}`}
function loadFile(file,callback){if(!file||!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=()=>callback({name:file.name,url:reader.result});reader.readAsDataURL(file)}function action(el){const op=el.dataset.action;state.feedback='';if(op==='kind'){const k=el.dataset.value;if(k!==state.kind){state.kind=k;state.images={};state.qrs={};state.chosen=-1}}else if(op==='method')state.method=el.dataset.value;else if(op==='next'){if(state.step===0){state.name=$('name').value.trim();state.number=$('number').value.trim();if(!state.name){state.feedback='コーデ名を入力してね。';render();return}}state.step=Math.min(4,state.step+1)}else if(op==='back'){state.step=Math.max(0,state.step-1);state.chosen=-1}else if(op==='skip'||op==='detail')state.step=4;else if(op==='photos')$('photoInput').click();else if(op==='slot'){const i=+el.dataset.index;if(state.chosen<0)state.chosen=i;else if(state.chosen===i)state.chosen=-1;else{const a=state.images[state.chosen],b=state.images[i];if(a)state.images[i]=a;else delete state.images[i];if(b)state.images[state.chosen]=b;else delete state.images[state.chosen];state.chosen=-1}}else if(op==='remove-image'){if(state.chosen>=0){delete state.images[state.chosen];state.chosen=-1}}else if(op==='qr'){state.uploadFor=+el.dataset.index;$('qrInput').click()}else if(op==='other'){state.method=state.method==='qr'?'image':'qr';state.chosen=-1}else if(op==='full')$('fullInput').click();else if(op==='editqr'){state.method='qr';state.step=3}else if(op==='editimage'){state.method='image';state.step=3}else if(op==='finish'){state.confirmed=true}else if(op==='restart'){for(const k in state)delete state[k];Object.assign(state,{step:0,name:'',number:'',kind:'separate',match:'new',method:'qr',images:{},qrs:{},full:null,chosen:-1,uploadFor:null,feedback:'',confirmed:false})}render()}
$('main').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b)});$('footer').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b)});$('main').addEventListener('change',e=>{if(e.target.name==='match')state.match=e.target.value});$('main').addEventListener('input',e=>{if(e.target.id==='name')state.name=e.target.value;if(e.target.id==='number')state.number=e.target.value});$('photoInput').addEventListener('change',e=>{const files=Array.from(e.target.files||[]).slice(0,categories().length);if(!files.length)return;let finished=0;const next={};files.forEach((file,i)=>loadFile(file,obj=>{next[i]=obj;if(++finished===files.length){state.images=next;state.chosen=-1;state.feedback=`${files.length}枚を仮配置したよ。`;render()}}));e.target.value=''});$('qrInput').addEventListener('change',e=>{const idx=state.uploadFor;loadFile(e.target.files[0],obj=>{state.qrs[idx]=obj;render()});e.target.value=''});$('fullInput').addEventListener('change',e=>{loadFile(e.target.files[0],obj=>{state.full=obj;render()});e.target.value=''});render();})();
</script></body></html>

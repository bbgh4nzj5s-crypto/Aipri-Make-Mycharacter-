<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>マイキャラ帳</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#17171b;background:#f2f2f7}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#f2f2f7ed;backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;z-index:3;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e3e3e8}h1{font-size:29px;margin:18px 0 24px}h2{font-size:17px;margin:26px 0 9px}main{max-width:700px;margin:auto;padding:0 16px 110px}.card{background:white;border-radius:17px;padding:15px;margin:12px 0}.row{display:flex;align-items:center;gap:12px}.grow{flex:1}.muted{color:#8c8c98;font-size:13px}.btn{border:0;border-radius:12px;background:#7058d4;color:white;padding:12px 16px;font-size:15px;font-weight:650}.soft{background:#e9e5fa;color:#5843b1}.ghost{background:#fff;color:#5c4ac4;border:1px solid #e1dcef}button{cursor:pointer}input,textarea,select{width:100%;padding:12px;border:1px solid #dedee5;border-radius:12px;font:inherit;background:white}textarea{min-height:105px;resize:vertical}label{display:block;font-size:13px;color:#666674;margin:13px 0 5px}.thumb{height:65px;width:65px;object-fit:cover;border-radius:12px;background:#eaeaf0}.photo{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#eaeaf0}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile{position:relative}.tile button{margin-top:5px;font-size:12px}.add{border:2px dashed #cbc6e7;border-radius:12px;aspect-ratio:3/4;background:#f7f5ff;color:#7563bf;display:grid;place-content:center;text-align:center}.nav{display:flex;gap:8px;flex-wrap:wrap}.chip{border:0;border-radius:18px;padding:9px 13px;background:#ededf3;color:#42414c}.chip.active{background:#6f58d6;color:white}.hidden{display:none}.line{border-bottom:1px solid #eee;padding:12px 0}.link{color:#6852c6;border:0;background:none;font-size:15px}.badge{background:#ece8fb;border-radius:12px;padding:5px 9px;font-size:12px;color:#6048a9}.mini{padding:8px 10px;font-size:12px}.empty{padding:25px;text-align:center;color:#888}#notice{font-size:12px;color:#777;text-align:center;margin-top:20px}</style></head><body><header><button class="link" id="back" onclick="go('home')" style="visibility:hidden">‹ 戻る</button><b id="heading">ライブラリ</b><button class="link" id="new" onclick="newCharacter()">＋</button></header><main id="app"></main><script>
const KEY='mycharacter_11';let data;try{data=JSON.parse(localStorage.getItem(KEY))||{characters:[],links:[]}}catch{data={characters:[],links:[]}};let page='home',current=null,tab='design';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function ch(){return data.characters.find(c=>c.id===current)}function go(p){page=p;render()}function openChar(x){current=x;tab='design';go('detail')}function newCharacter(){let c={id:id(),name:'新しいマイキャラ',nickname:'',intro:'',notes:'',designs:[],refs:[],album:[],cover:null};data.characters.push(c);current=c.id;save();go('edit')}function render(){document.getElementById('back').style.visibility=page==='home'?'hidden':'visible';document.getElementById('new').style.visibility=page==='home'?'visible':'hidden';document.getElementById('heading').textContent=({home:'ライブラリ',detail:'キャラクター',edit:'プロフィール編集',relations:'相関図'})[page];let a=document.getElementById('app');if(page==='home'){a.innerHTML=`<h1>ライブラリ</h1><h2>キャラクター <span class="muted">${data.characters.length}人</span></h2><div class="card">${data.characters.length?data.characters.map(c=>`<div class="row line" onclick="openChar('${c.id}')"><img class="thumb" src="${c.cover||''}" onerror="this.style.opacity=.3"><div class="grow"><b>${esc(c.name)}</b><div class="muted">${esc(c.intro||'キャラデザイン・プロフィール')}</div></div><span>›</span></div>`).join(''):'<div class="empty">まだキャラクターがいません</div>'}</div><button class="btn" onclick="newCharacter()">＋ 新規キャラクター</button><h2>人物関係</h2><div class="card" onclick="go('relations')">相関図・関連人物 <span style="float:right">›</span></div><div id="notice">データはこのブラウザ内に保存されます。バックアップを定期的に作成してください。</div><p><button class="btn soft" onclick="backup()">バックアップを書き出す</button> <button class="btn ghost" onclick="document.getElementById('restore').click()">復元</button><input id="restore" class="hidden" type="file" accept="application/json" onchange="restore(event)"></p>`;return}if(page==='relations'){a.innerHTML=`<h1>相関図・関連人物</h1><div class="card"><label>人物A</label><select id="from">${options()}</select><label>人物B</label><select id="to">${options()}</select><label>関係（例：親友、ライバル、姉妹）</label><input id="relation" placeholder="関係を入力"><p><button class="btn" onclick="addRelation()">関係を追加</button></p></div><h2>登録した関係</h2><div class="card">${data.links.map((r,i)=>`<div class="line"><b>${esc(nameOf(r.from))} ─ ${esc(r.label)} ─ ${esc(nameOf(r.to))}</b> <button class="link" onclick="data.links.splice(${i},1);save();render()">削除</button></div>`).join('')||'<div class="empty">人物関係はまだありません</div>'}</div><h2>相関図（簡易表示）</h2><div class="card" style="overflow:auto"><svg viewBox="0 0 320 ${Math.max(200,data.characters.length*85)}" style="width:100%;min-width:280px">${data.characters.map((c,i)=>`<rect x="12" y="${i*85+12}" width="130" height="54" rx="12" fill="#eee9fa"/><text x="20" y="${i*85+44}" font-size="12">${esc(c.name).slice(0,12)}</text>`).join('')}${data.links.map((r,i)=>{let f=data.characters.findIndex(c=>c.id===r.from),t=data.characters.findIndex(c=>c.id===r.to);return f<0||t<0?'':`<path d="M142 ${f*85+40} Q245 ${(f+t)*42+40} 142 ${t*85+40}" fill="none" stroke="#856bd6" stroke-width="2"/><text x="180" y="${(f+t)*42+32}" font-size="10">${esc(r.label).slice(0,9)}</text>`}).join('')}</svg></div>`;return}let c=ch();if(!c){go('home');return}if(page==='edit'){a.innerHTML=`<h1>プロフィール編集</h1><div class="card"><label>名前</label><input id="name" value="${esc(c.name)}"><label>ニックネーム</label><input id="nickname" value="${esc(c.nickname)}"><label>ひとこと紹介</label><textarea id="intro">${esc(c.intro)}</textarea><label>キャラ設定メモ</label><textarea id="notes">${esc(c.notes)}</textarea><p><button class="btn" onclick="commit()">保存する</button></p></div>`;return}a.innerHTML=`<div class="row" style="margin-top:20px"><img class="thumb" src="${c.cover||''}" onerror="this.style.opacity=.25"><div class="grow"><h1 style="margin:0">${esc(c.name)}</h1><div class="muted">${esc(c.nickname||c.intro)}</div></div><button class="btn soft mini" onclick="go('edit')">編集</button></div><div class="nav" style="margin:22px 0">${[['design','キャラデザ'],['refs','参考画像'],['album','アルバム'],['profile','設定・人物']].map(([k,v])=>`<button class="chip ${tab===k?'active':''}" onclick="tab='${k}';render()">${v}</button>`).join('')}</div>${tab==='profile'?`<div class="card"><h2>名前・プロフィール</h2><p>${esc(c.name)} ${esc(c.nickname)}</p><p>${esc(c.intro)}</p><h2>キャラ設定メモ</h2><p style="white-space:pre-wrap">${esc(c.notes)||'未入力'}</p><button class="btn soft" onclick="go('edit')">編集する</button><h2>関連人物</h2>${data.links.filter(r=>r.from===c.id||r.to===c.id).map(r=>`<div class="line">${esc(nameOf(r.from===c.id?r.to:r.from))}：${esc(r.label)}</div>`).join('')||'<p class="muted">まだ登録されていません</p>'}<button class="btn ghost" onclick="go('relations')">相関図を開く</button></div>`:`<h2>${{design:'キャラデザイン案',refs:'参考画像',album:'画像アルバム'}[tab]}</h2><div class="tiles">${c[tab==='design'?'designs':tab].map((im,i)=>`<div class="tile"><img class="photo" src="${im.src}" onclick="viewImage('${tab}',${i})"><div class="muted">${esc(im.memo||'画像 '+(i+1))}</div><button class="link mini" onclick="setCover('${tab}',${i})">メインに設定</button></div>`).join('')}<label class="add">＋<br>画像を追加<input class="hidden" type="file" accept="image/*" multiple onchange="addImages(event,'${tab}')"></label></div><p class="muted">画像をタップするとメモの編集や削除ができます。</p>${tab==='design'?'<p class="muted">アイプリ内蔵パーツ選択は次の開発段階で追加予定です。</p>':''}`}<p><button class="link" onclick="if(confirm('このキャラを削除しますか？')){data.characters=data.characters.filter(x=>x.id!==current);data.links=data.links.filter(r=>r.from!==current&&r.to!==current);save();go('home')}">キャラクターを削除</button></p>`}
function options(){return data.characters.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}function nameOf(x){return data.characters.find(c=>c.id===x)?.name||'削除済み'}function commit(){let c=ch();for(let k of ['name','nickname','intro','notes'])c[k]=document.getElementById(k).value;save();go('detail')}function addRelation(){let from=document.getElementById('from').value,to=document.getElementById('to').value,label=document.getElementById('relation').value.trim();if(!from||!to||from===to||!label){alert('異なる2人と関係名を入力してください');return}data.links.push({from,to,label});save();render()}function addImages(e,k){let files=[...e.target.files],c=ch(),arr=c[k==='design'?'designs':k];Promise.all(files.map(f=>new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve({src:r.result,memo:''});r.onerror=reject;r.readAsDataURL(f)}))).then(items=>{arr.push(...items);if(!c.cover&&items.length)c.cover=items[0].src;try{save();render()}catch{arr.splice(-items.length);alert('保存容量を超えました。画像を減らしてください。')}})}function viewImage(k,i){let a=ch()[k==='design'?'designs':k],im=a[i],memo=prompt('画像メモを編集（削除する場合は次の確認で操作）',im.memo||'');if(memo===null)return;im.memo=memo;if(confirm('この画像を削除しますか？（キャンセルでメモだけ保存）')){a.splice(i,1)}save();render()}function setCover(k,i){ch().cover=ch()[k==='design'?'designs':k][i].src;save();render()}function backup(){let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='mycharacter-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function restore(e){let f=e.target.files[0];if(!f)return;f.text().then(s=>{let d=JSON.parse(s);if(!Array.isArray(d.characters)||!Array.isArray(d.links))throw Error('invalid');if(confirm('現在のデータをバックアップで置き換えますか？')){data=d;save();go('home')}}).catch(()=>alert('バックアップを読み込めませんでした'))}render();</script></body></html>
